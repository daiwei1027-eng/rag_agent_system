[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent-system"
version = "0.1.0"
description = "A local RAG Agent with tool calling, retrieval evaluation, and a FastAPI service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faiss-cpu>=1.15.1,<2",
  "numpy>=2.4.6,<3",
  "pyyaml>=6.0.3,<7",
  "sentence-transformers>=6.1,<7",
  "torch>=2.11,<3",
  "transformers>=5.17,<6",
]

[project.optional-dependencies]
service = [
  "fastapi>=0.143.3,<0.144",
  "uvicorn>=0.54,<0.55",
  "pydantic>=2.14.1,<3",
]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.7,<1",
  "httpx>=0.28,<1",
]

[project.scripts]
rag-query = "rag_agent_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

